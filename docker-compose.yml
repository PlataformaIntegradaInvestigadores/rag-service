name: rag

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # default: rag-service resolves it as `ollama`.
    # centinela-net: search-service reuses the same daemon (qwen2.5:1.5b)
    # without going through POST /ask.
    networks:
      - default
      - centinela-net

  # One-shot: pull models into the shared ollama volume on first/boot.
  # Idempotent — ollama pull skips download if the tag is already present.
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Space-separated list; override via .env if needed
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-gemma3:4b qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[ollama-init] waiting for daemon at $$OLLAMA_HOST"
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i + 1))
          if [ "$$i" -gt 60 ]; then
            echo "[ollama-init] timeout waiting for ollama" >&2
            exit 1
          fi
          sleep 2
        done
        for model in $$OLLAMA_PULL_MODELS; do
          echo "[ollama-init] pulling $$model ..."
          ollama pull "$$model"
        done
        echo "[ollama-init] models ready:"
        ollama list
    restart: "no"
    networks:
      - default
      - centinela-net

  rag-service:
    build: .
    container_name: rag-service
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8181:8181"
    env_file:
      - .env
    environment:
      # Rutas artefactos
      PKL_MIN_PATH: ${PKL_MIN_PATH:-/app/resources/embeddings_meta_min.pkl}
      FAISS_PATH: ${FAISS_PATH:-/app/resources/faiss_index_ip.bin}
      SCOPUS_CSV: ${SCOPUS_CSV:-/app/resources/scopusdata.csv}
      SCOPUS_SEP: ${SCOPUS_SEP:-|}
      LID_MODEL_PATH: ${LID_MODEL_PATH:-/app/resources/lid.176.ftz}

      # Re-ranking (cross-encoder)
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      CE_BATCH_SIZE: ${CE_BATCH_SIZE:-64}
      W_CE: ${W_CE:-0.7}
      W_DENSE: ${W_DENSE:-0.3}

      # Ollama dentro de Compose (service DNS, sin cambio)
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}

      # Puerto FastAPI (debe coincidir con el CMD/uvicorn o __main__)
      PORT: ${PORT:-8181}

      # RAG params
      RAG_TEMPERATURE: ${RAG_TEMPERATURE:-0.2}
      RAG_MAX_NEW_TOKENS: ${RAG_MAX_NEW_TOKENS:-768}
      RAG_TOP_CONTEXT: ${RAG_TOP_CONTEXT:-6}
      RAG_MAX_INPUT_CHARS: ${RAG_MAX_INPUT_CHARS:-7000}
      RAG_MAX_CHUNK_CHARS: ${RAG_MAX_CHUNK_CHARS:-900}
      RAG_TRIM_ABSTRACT: ${RAG_TRIM_ABSTRACT:-1}
      API_TOPK: ${API_TOPK:-100}
      RAG_HTTP_TIMEOUT_SECS: ${RAG_HTTP_TIMEOUT_SECS:-300}
    restart: unless-stopped
    networks:
      - default
      - centinela-net

volumes:
  ollama-data:
    name: rag_ollama-data

networks:
  centinela-net:
    external: true
